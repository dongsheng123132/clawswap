[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
solc_version = "0.7.6"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
ignore = [
  "src/core/test/**",
  "src/periphery/test/**",
  "src/periphery/examples/**",
  "src/periphery/V3Migrator.sol",
  "src/periphery/NonfungibleTokenPositionDescriptor.sol",
  "src/periphery/lens/**",
  "src/periphery/libraries/NFTDescriptor.sol",
  "src/periphery/libraries/NFTSVG.sol",
]
